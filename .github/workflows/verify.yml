name: Verify candidate
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: intraspot
          POSTGRES_PASSWORD: ci-only-disposable-password
          POSTGRES_DB: intraspot_mvp
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U intraspot -d intraspot_mvp"
          --health-interval 5s --health-timeout 5s --health-retries 12
    defaults:
      run:
        working-directory: Code/Backend
    env:
      ENVIRONMENT: local
      FIXTURE_AUTH: 'true'
      AUTH_PROVIDER: fixture
      DATABASE_URL: postgresql+psycopg://intraspot:ci-only-disposable-password@127.0.0.1:5433/intraspot_mvp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install --require-hashes -r requirements.lock
      - run: python -m app.local_setup
      - run: python ../../scripts/check_delivery.py
      - run: python -m pytest -q --junitxml=.cache/backend-results.xml
      - run: python -m pytest auth_tests -q --junitxml=.cache/auth-results.xml
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Code/Frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: Code/Frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npx tsc --noEmit
      - run: npm run build
        env:
          NEXT_PUBLIC_AUTH_MODE: fixture
          NEXT_PUBLIC_LOCAL_DEMO: 'false'
      - run: npm audit --audit-level=high
      - run: node scripts/check-public-assets.mjs out
      - run: npm run build:hosted
        env:
          NEXT_PUBLIC_DEPLOYMENT: hosted
          NEXT_PUBLIC_FRONTEND_ORIGIN: https://intraspot-evaluation.pages.dev
          NEXT_PUBLIC_API_URL: https://intraspot-evaluation.koyeb.app
          NEXT_PUBLIC_AUTH_MODE: supabase
          NEXT_PUBLIC_LOCAL_DEMO: 'false'
          NEXT_PUBLIC_SUPABASE_URL: https://ci-evaluation.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_public_placeholder_only
