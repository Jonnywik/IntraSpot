name: intraspot-mvp
services:
  postgres:
    image: postgres:17
    ports:
      - "127.0.0.1:5433:5432"
    environment:
      POSTGRES_USER: intraspot
      POSTGRES_DB: intraspot_mvp
      POSTGRES_PASSWORD: ${MVP_DB_PASSWORD:?Run python -m app.local_setup first}
    volumes:
      - mvp-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U intraspot -d intraspot_mvp"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  mvp-data:
