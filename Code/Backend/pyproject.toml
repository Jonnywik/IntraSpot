[project]
name = "intraspot-backend"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "fastapi==0.142.2",
    "uvicorn==0.54.0",
    "sqlalchemy>=2.0.45,<2.1",
    "psycopg[binary]>=3.3,<4",
    "alembic>=1.17,<2",
    "PyJWT[crypto]>=2.10,<3",
    "pydantic-settings>=2.12,<3",
    "Pillow==13.0.0",
]

[dependency-groups]
dev = ["pytest>=9,<10", "httpx>=0.28,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--import-mode=importlib"
